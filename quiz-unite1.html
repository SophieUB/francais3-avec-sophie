<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Quiz — Unité 1</title>


  <style>

    :root {
      --bleu-fonce: #1D476E;
      --bleu-clair: #74BACD;
      --rose: #EE3167;
      --fond: #F4F7FA;
      --blanc: #FFFFFF;
      --texte: #173047;
      --gris: #667785;
    }


    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: var(--fond);

      color: var(--texte);

      line-height: 1.6;
    }


    .conteneur {
      width: min(
        900px,
        calc(100% - 32px)
      );

      margin: auto;
    }


    /* =================================
       EN-TÊTE
       ================================= */

    header {
      background:
        var(--bleu-fonce);

      color: white;

      padding: 40px 20px;

      text-align: center;
    }


    header h1 {
      margin: 0 0 7px;

      font-size: 32px;
    }


    header p {
      margin: 0;

      opacity: 0.9;
    }


    /* =================================
       CONTENU
       ================================= */

    main {
      padding:
        35px 0 60px;
    }


    .carte {
      background:
        var(--blanc);

      border-radius: 18px;

      padding: 30px;

      box-shadow:
        0 4px 18px
        rgba(29, 71, 110, 0.09);
    }


    .quiz-intro {
      text-align: center;

      margin-bottom: 28px;
    }


    .quiz-intro h2 {
      color:
        var(--bleu-fonce);

      margin:
        0 0 8px;
    }


    .quiz-intro p {
      color:
        var(--gris);

      margin: 0;
    }


    /* =================================
       3 CHOIX
       ================================= */

    #quiz-menu {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 16px;
    }


    .quiz-menu-btn {

      border:
        2px solid #E1E8ED;

      background:
        white;

      border-radius:
        16px;

      padding:
        24px 15px;

      cursor: pointer;

      display: flex;

      flex-direction:
        column;

      align-items:
        center;

      gap: 7px;

      color:
        var(--texte);

      font-family:
        inherit;

      transition:
        0.2s;
    }


    .quiz-menu-btn:hover {

      transform:
        translateY(-3px);

      border-color:
        var(--bleu-clair);
    }


    .quiz-menu-btn span {

      font-size:
        32px;
    }


    .quiz-menu-btn strong {

      color:
        var(--bleu-fonce);

      font-size:
        18px;
    }


    .quiz-menu-btn small {

      color:
        var(--gris);

      text-align:
        center;

      font-size:
        13px;
    }


    .quiz-mixte {

      border-color:
        var(--rose);
    }


    /* =================================
       RETOUR
       ================================= */

    .retour {

      margin-top:
        28px;

      text-align:
        center;
    }


    .retour a {

      color:
        var(--bleu-fonce);

      text-decoration:
        none;

      font-weight:
        bold;
    }


    /* =================================
       MOBILE
       ================================= */

    @media
    (max-width: 700px) {

      #quiz-menu {

        grid-template-columns:
          1fr;
      }


      .carte {

        padding:
          22px 16px;
      }


      header h1 {

        font-size:
          27px;
      }

    }

  </style>

</head>



<body>


<!-- =================================
     EN-TÊTE
     ================================= -->

<header>

  <div class="conteneur">

    <h1>
      Quiz — Unité 1
    </h1>

    <p>
      Prochain arrêt : nouveau départ
    </p>

  </div>

</header>



<main class="conteneur">


  <!-- =================================
       QUIZ
       ================================= -->

  <section
    id="quiz-section"
    class="carte">


    <div class="quiz-intro">

      <h2>
        Grammaire et vocabulaire
      </h2>

      <p>
        Révise le contenu des
        semaines 1 à 3.
      </p>

    </div>



    <!-- =================================
         MENU DU QUIZ
         ================================= -->

    <div id="quiz-menu">


      <!-- GRAMMAIRE -->

      <button
        type="button"
        class="quiz-menu-btn"
        onclick="demarrerQuiz('grammaire')">

        <span>📝</span>

        <strong>
          Grammaire
        </strong>

        <small>
          Réviser les points
          de grammaire
        </small>

      </button>



      <!-- VOCABULAIRE -->

      <button
        type="button"
        class="quiz-menu-btn"
        onclick="demarrerQuiz('vocabulaire')">

        <span>💬</span>

        <strong>
          Vocabulaire
        </strong>

        <small>
          Réviser les mots
          et expressions
        </small>

      </button>



      <!-- MIXTE -->

      <button
        type="button"
        class="
          quiz-menu-btn
          quiz-mixte
        "
        onclick="demarrerQuiz('mixte')">

        <span>🎯</span>

        <strong>
          Quiz mixte
        </strong>

        <small>
          Grammaire
          + vocabulaire
        </small>

      </button>


    </div>



    <!-- =================================
         RETOUR
         ================================= -->

    <div class="retour">

      <a href="quiz.html">
        ← Retour à tous les quiz
      </a>

    </div>


  </section>


</main>



<script>

/*
=========================================================
POUR LE MOMENT :

Les boutons fonctionnent,
mais nous allons connecter
les questions à l'étape suivante.
=========================================================
*/

function demarrerQuiz(type) {

  alert(
    "Quiz " +
    type +
    " — bientôt prêt !"
  );

}

</script>


</body>
</html>
