<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mon espace de français</title>

  <style>
    :root {
      --bleu-fonce: #1D476E;
      --bleu-clair: #74BACD;
      --rose: #EE3167;
      --fond: #F4F7FA;
      --blanc: #FFFFFF;
      --texte: #173047;
      --gris: #667785;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--texte);
      background: var(--fond);
      line-height: 1.6;
    }
