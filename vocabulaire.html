<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vocabulaire — French 3</title>

  <link rel="stylesheet" href="vocabulaire.css">
</head>
<body>

  <!-- =========================
       EN-TÊTE
       ========================= -->

  <header>

    <div class="conteneur">

      <h1>Vocabulaire</h1>

      <p>
        Cette liste de vocabulaire n'est pas exhaustive.
        À vous de la compléter !
      </p>

    </div>

  </header>


  <!-- =========================
       CONTENU
       ========================= -->

  <main>

    <div class="conteneur">


      <!-- OUTILS -->

      <div class="outils">

        <input
          type="search"
          id="recherche"
          class="recherche"
          placeholder="🔎 Rechercher un mot en français ou en anglais..."
          aria-label="Rechercher dans le vocabulaire"
        >

        <button
          id="bouton-anglais"
          class="bouton"
          type="button"
        >
          Masquer l'anglais
        </button>

      </div>


      <div id="aucun-resultat">
        Aucun mot trouvé.
      </div>


      <!--
      ==========================================================
      LE VOCABULAIRE SERA CRÉÉ AUTOMATIQUEMENT ICI
      ==========================================================
      -->

      <section
        id="vocabulaire"
        class="unite-vocabulaire"
      ></section>


      <a
        class="retour"
        href="index.html"
      >
        ← Retour à l’accueil
      </a>


    </div>

  </main>


  <script src="vocabulaire-data.js"></script>
  <script src="vocabulaire.js"></script>

</body>
</html>
